name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install pyyaml pytest
          pip install -e .
      - name: Run tests
        run: pytest -v
      - name: Smoke audit
        run: |
          privanity audit --target examples/sample_tree --baseline profiles/privacy.yaml --format json
