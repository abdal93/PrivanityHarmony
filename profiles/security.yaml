# ohm-hardener (PrivanityHarmony) — security baseline
# Builds on the privacy profile and layers stricter security controls.
# Import via CLI: baseline profiles can be composed by passing the stricter
# profile; rules missing from a profile still run against the engine defaults.

profile:
  name: security
  version: 0.1.0
  description: Security-first hardening baseline (signing, SELinux labels, crypto-grade RNG, strong auth, network default-deny)

controls:
  # inherits privacy controls + adds:
  signed_packages:
    patterns: ["*.hap", "*.app", "*.pem", "*.cer", "*.zip", "*.json"]
    weight: 2.0
  security_labels:
    patterns: ["*selinux*", "*.te", "*.cil", "*.json", "*.xml"]
    weight: 1.5
  mtu_weak_random:
    patterns: ["*.json", "*.c", "*.cpp", "*.py", "*.toml", "*.cfg"]
    weight: 1.0
  network_restrict:
    patterns: ["*network*.json", "*profile*.json", "*.json", "*.conf"]
    weight: 1.5
  disable_bg_diagnostics:
    patterns: ["*.json", "*.xml", "*.conf"]
    weight: 1.0
  enforce_strong_pin:
    patterns: ["*lock*.json", "*auth*.json", "*.json", "*.xml"]
    weight: 1.0

  # privacy controls carried forward (weights preserved)
  no_telemetry_sdk:
    patterns: ["*.json", "*.xml"]
    weight: 2.0
  no_crash_reporting:
    patterns: ["*.json", "*.xml"]
    weight: 1.5
  contacts_off:
    patterns: ["*permission*.json", "*manifest*.xml", "*.xml", "*.json"]
    weight: 2.0
  location_off:
    patterns: ["*permission*.json", "*manifest*.xml", "*.xml", "*.json"]
    weight: 2.0
  camera_mic_off:
    patterns: ["*permission*.json", "*manifest*.xml", "*.xml", "*.json"]
    weight: 2.0
  network_profile_present:
    patterns: ["*profile*.json", "*.json"]
    weight: 1.5
  disable_auto_updates:
    patterns: ["*.json", "*.xml", "*.cfg"]
    weight: 1.5
  remove_debug_keystore:
    weight: 1.0
  usage_notice_present:
    weight: 0.5